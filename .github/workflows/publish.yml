# Not yet run: needs GitHub Actions to be available, and this repository registered as a trusted
# publisher for the package on npmjs.com. Until then the first release is published by hand.
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm ci
      # The publish job skips scripts, so the release gate that prepublishOnly would run has to happen here.
      - run: npm run release:check

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # Add required reviewers to this environment in the repository settings to hold every release for approval.
    environment: npm-publish
    # Only this job can mint the OIDC token, and it runs no repository code: the checks ran in verify.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer; the npm bundled with Node 24 may be older.
      - run: npm install -g npm@^11.5.1
      - run: npm ci --ignore-scripts
      - run: npm publish --provenance --access public --ignore-scripts
